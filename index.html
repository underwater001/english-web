<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SSC CGL English question bank: grammar rules, vocabulary and comprehension, with every answer explained and every wrong option explained too.">
<title>English Web</title>
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --sunk:#ece9e1; --ink:#1d2330; --muted:#5d6472; --line:#d9d5c9;
  --accent:#1f4fbf; --accent-soft:#e3ebfb; --ok:#1b7a47; --ok-soft:#e1f3e8; --bad:#b3261e; --bad-soft:#fbe3e0; --warn:#9a5b00; --warn-soft:#fbefd6;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1a1f28; --sunk:#222834; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2e3644;
  --accent:#8fb0ff; --accent-soft:#1e2a45; --ok:#6fd39b; --ok-soft:#14332a; --bad:#ff8d84; --bad-soft:#3b1a18; --warn:#ffc266; --warn-soft:#38290e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1a1f28; --sunk:#222834; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2e3644;
  --accent:#8fb0ff; --accent-soft:#1e2a45; --ok:#6fd39b; --ok-soft:#14332a; --bad:#ff8d84; --bad-soft:#3b1a18; --warn:#ffc266; --warn-soft:#38290e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45}
.page{max-width:980px;margin:0 auto;padding:14px 16px 64px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:flex-end;justify-content:space-between}
.brand h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.015em}
.brand p{margin:2px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
nav.tabs a{font-size:14px;font-weight:600;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);text-decoration:none}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h3{margin:0;font-size:16px;font-weight:700}
h4{margin:0 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lead{margin:0;font-family:var(--body);font-size:16px;line-height:1.55}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.empty{padding:22px;text-align:center;color:var(--muted);font-family:var(--body);border:1px dashed var(--line);border-radius:10px}
section.block{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.card.dim{opacity:.6}
.card a.title{color:var(--ink);text-decoration:none;font-weight:700;font-size:16px}
.card a.title:hover{text-decoration:underline}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--sunk);color:var(--muted);text-decoration:none}
a.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.Easy{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.Medium{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.Hard{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.rule{border-left:3px solid var(--accent);padding:6px 12px;background:var(--surface);border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:4px}
.ex{font-family:var(--body);font-size:14px}
.ex.ok::before{content:"✓ ";color:var(--ok);font-weight:700}
.ex.bad::before{content:"✗ ";color:var(--bad);font-weight:700}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details>summary{cursor:pointer;font-weight:600}
details p,details ul{font-family:var(--body);margin:6px 0 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=search]{flex:1 1 220px}
button.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
article.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qtext{margin:0;font-family:var(--body);font-size:17px;line-height:1.5;white-space:pre-line}
.qtext mark{background:var(--accent-soft);color:var(--ink);padding:0 3px;border-radius:3px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;text-align:left;font:inherit;font-family:var(--body);font-size:16px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;width:100%}
.opt b{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px;text-transform:uppercase}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrongpick{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.reveal{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.reveal p{margin:0;font-family:var(--body);font-size:15px}
.reveal ul{margin:0;padding-left:20px;font-family:var(--body);font-size:14px;display:flex;flex-direction:column;gap:3px}
.caution{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);padding:7px 11px;border-radius:0 8px 8px 0}
details.passage{background:var(--sunk)}
.verdict{font-weight:800}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.lex{display:flex;flex-direction:column;gap:4px}
.lex .w{font-size:17px;font-weight:700}
.lex .m{font-family:var(--body)}
.pagenav{font-size:13px}
.pagenav a{color:var(--accent)}
footer{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(144px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:1px}
.tile b{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile small{font-family:var(--body);font-size:13px;color:var(--muted)}
.tile.hot b{color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.t th,table.t td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
table.t th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono)}
table.t tr:last-child td{border-bottom:0}
table.t td a{color:var(--accent)}
.wrap{overflow-x:auto}
.sticky{position:sticky;top:48px;z-index:4;background:var(--bg);padding:7px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.timer{font-family:var(--mono);font-size:19px;font-weight:700;padding:3px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.opt.picked{background:var(--accent-soft);border-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qnum{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em}
textarea{font:inherit;font-family:var(--mono);font-size:11px;width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px}
.chip.hot{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.due{background:var(--accent-soft);color:var(--accent);border-color:transparent}
@media (max-width:520px){.qtext{font-size:16px}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand"><h1>English Web</h1><p>SSC CGL English: learn the rule, drill it, keep it</p></div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="view" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>
<script>
(function(){
const D = window.__DATA__ || {};
const $ = (s, e) => (e || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const mark = s => esc(s).replace(/\[\[(.+?)\]\]/g, "<mark>$1</mark>");
const cache = {};
async function J(p){
  if (D[p]) return D[p];
  if (cache[p]) return cache[p];
  const r = await fetch(p); if (!r.ok) throw new Error(p + " " + r.status);
  return cache[p] = await r.json();
}
const LV = ["Easy", "Medium", "Hard"];
const LET = "abcd";
let core, ROWS = [], rulesById = {}, passagesById = {}, shardCache = null;

// ---------------------------------------------------------------- what you remember
// One box per question (Leitner). A right answer moves it up a box and pushes the next showing further away;
// a wrong answer sends it back to box 0 and into the mistake book until it is solid again.
const DAYMS = 864e5;
const BOX = [0, 1, 3, 7, 16, 35];
const SOLID = 3;
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 6e4) / DAYMS); };
let ST = {v: 3, items: {}, known: {}, mocks: [], days: []};
(function restore(){
  try {
    const raw = localStorage.getItem("ew-state");
    if (raw) { const o = JSON.parse(raw) || {}; ST = {v: 3, items: o.items || {}, known: o.known || {}, mocks: o.mocks || [], days: o.days || []}; return; }
    const P = JSON.parse(localStorage.getItem("ew-progress") || "{}"), K = JSON.parse(localStorage.getItem("ew-known") || "{}"), d = today();
    for (const [id, v] of Object.entries(P)) ST.items[id] = {b: v ? 1 : 0, c: v ? 1 : 0, n: 1, w: v ? 0 : 1, last: d, due: d + (v ? 1 : 0), ok: !!v};
    ST.known = K || {};
    if (Object.keys(ST.items).length) save();
  } catch (e) {}
})();
function save(){ try { localStorage.setItem("ew-state", JSON.stringify(ST)); } catch (e) {} }
function record(id, ok){
  const d = today(), x = ST.items[id] || {b: 0, c: 0, n: 0, w: 0};
  x.n++; if (ok) { x.c = (x.c || 0) + 1; x.b = Math.min(5, (x.b || 0) + 1); } else { x.w = (x.w || 0) + 1; x.b = 0; }
  x.ok = ok; x.last = d; x.due = d + BOX[x.b]; ST.items[id] = x;
  if (!ST.days.includes(d)) ST.days.push(d);
  save();
}
const isDue = id => { const x = ST.items[id]; return !!x && x.due <= today(); };
const isMistake = id => { const x = ST.items[id]; return !!x && (x.w || 0) > 0 && x.b < SOLID; };
const isSolid = id => { const x = ST.items[id]; return !!x && x.b >= SOLID; };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

function formatRows(){
  const bp = core.blueprint || {formats: []}, by = {};
  ROWS.forEach(r => {
    const o = by[r.fmt] || (by[r.fmt] = {stock: 0, tried: 0, n: 0, c: 0, due: 0, solid: 0, mistakes: 0});
    o.stock++;
    const x = ST.items[r.id];
    if (x) { o.tried++; o.n += x.n; o.c += x.c || 0; if (isDue(r.id)) o.due++; if (isSolid(r.id)) o.solid++; if (isMistake(r.id)) o.mistakes++; }
  });
  return bp.formats.map(f => {
    const o = by[f.fmt] || {stock: 0, tried: 0, n: 0, c: 0, due: 0, solid: 0, mistakes: 0};
    const acc = o.n ? o.c / o.n : null;
    return Object.assign({}, f, o, {acc: acc, risk: f.perShift * (1 - (acc == null ? 0 : acc))});
  }).sort((a, b) => b.risk - a.risk || b.perShift - a.perShift);
}
const totals = () => ({
  stock: ROWS.length,
  due: ROWS.filter(r => isDue(r.id)).length,
  mistakes: ROWS.filter(r => isMistake(r.id)).length,
  solid: ROWS.filter(r => isSolid(r.id)).length,
  tried: ROWS.filter(r => ST.items[r.id]).length,
});

// ---------------------------------------------------------------- one question
function qLabel(q){
  if (q.paper) { const p = core.papers.find(x => x.id === q.paper); return p ? `${p.exam}, ${p.date}${p.shift ? ", shift " + p.shift : ""}, Q${q.qno}` : q.id; }
  return q.id.startsWith("q2") ? "Daily" : "Practice";
}
function qcard(q, o){
  o = o || {};
  const el = document.createElement("article"); el.className = "q";
  const x = ST.items[q.id];
  const hist = x ? `<span class="chip ${(x.w || 0) > 0 && x.b < SOLID ? "hot" : isSolid(q.id) ? "Easy" : ""}">seen ${x.n}× · ${x.c || 0} right${isSolid(q.id) ? " · solid" : ""}</span>` : "";
  const chips = `<div class="chips"><span class="chip ${q.level}">${q.level}</span><span class="chip">${esc(core.formats[q.fmt] || q.fmt)}</span><span class="chip">${esc(qLabel(q))}</span>${(q.tech || []).map(t => `<span class="chip">${esc(core.techniques[t] || t)}</span>`).join("")}${o.exam ? "" : hist}</div>`;
  const pg = q.passage ? passagesById[q.passage] : null;
  el.innerHTML = chips + (pg ? `<details class="passage" ${o.exam ? "open" : ""}><summary>Passage: ${esc(pg.title)}</summary><p class="lead">${esc(pg.text)}</p><p class="mono muted">${esc(pg.src)}</p></details>` : "") + `<p class="qtext">${mark(q.text)}</p><div class="opts">${q.options.map((op, i) => `<button class="opt" data-i="${i}"><b>${LET[i]}</b><span>${esc(op)}</span></button>`).join("")}</div><div class="reveal" hidden></div>`;
  const reveal = pick => {
    el.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; b.classList.remove("picked"); if (LET[j] === q.key) b.classList.add("right"); else if (LET[j] === pick) b.classList.add("wrongpick"); });
    const ok = pick === q.key;
    const rv = $(".reveal", el); rv.hidden = false;
    const notes = Object.entries(q.wrong || {}).sort().map(([k, v]) => `<li><b class="mono">${k.toUpperCase()}</b> ${esc(v.note)}${v.kind === "mistake" ? ' <span class="chip Medium">common mistake</span>' : ""}</li>`).join("");
    const rules = (q.rules || []).map(r => rulesById[r]).filter(Boolean).map(r => `<div class="rule"><span>${esc(r.text)}</span>${r.ok ? `<span class="ex ok">${esc(r.ok)}</span>` : ""}${r.bad ? `<span class="ex bad">${esc(r.bad)}</span>` : ""}</div>`).join("");
    const verdict = pick ? (ok ? "Correct" : "Not quite: the answer is " + q.key.toUpperCase()) : "Left blank: the answer is " + q.key.toUpperCase();
    rv.innerHTML = `<span class="verdict ${ok ? "ok" : "no"}">${verdict}</span><p>${esc(q.why)}</p>${q.trick ? `<p><b>Fastest way in:</b> ${esc(q.trick)}</p>` : ""}${rules}<h4>Why each wrong option fails</h4><ul>${notes}</ul>${q.caution ? `<p class="caution"><b>Caution:</b> ${esc(q.caution)}</p>` : ""}${q.keySource === "derived" ? '<p class="mono muted">Key worked out by us, not copied from an answer key.</p>' : q.keySource === "source" ? '<p class="mono muted">Key as printed in the source paper (a coaching "similar paper", not the official SSC key). We checked it against the rule.</p>' : ""}`;
    return ok;
  };
  if (o.exam) {
    el._q = q; el._pick = null;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".opt").forEach(z => z.classList.remove("picked"));
      b.classList.add("picked"); el._pick = LET[+b.dataset.i]; if (o.onPick) o.onPick();
    }));
    el._grade = () => reveal(el._pick);
  } else {
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const pick = LET[+b.dataset.i], ok = reveal(pick);
      record(q.id, ok); if (o.onAnswer) o.onAnswer(q, ok);
    }));
  }
  return el;
}

async function allShards(){
  if (shardCache) return shardCache;
  const out = [];
  for (const [t, m] of Object.entries(core.topics)) if (m.built) { const s = await J(`data/shards/${t}.json`); (s.rules || []).forEach(r => rulesById[r.id] = r); Object.assign(passagesById, s.passages || {}); out.push(s); }
  return shardCache = out;
}
async function everyQuestion(){
  const by = {};
  (await allShards()).forEach(s => [...s.pyqs, ...s.practice].forEach(q => by[q.id] = Object.assign({_t: s.topic}, q)));
  return by;
}

// pick questions the exam weights most and you are weakest at, unseen first
function weakFirst(limit, pool){
  const order = formatRows(), out = [], seen = new Set();
  const buckets = order.map(f => ROWS.filter(r => r.fmt === f.fmt && (!pool || pool[r.id]))
    .sort((a, b) => { const xa = ST.items[a.id], xb = ST.items[b.id]; return (xa ? xa.n : 0) - (xb ? xb.n : 0) || (LV.indexOf(a.level) - LV.indexOf(b.level)); }).map(r => r.id));
  let i = 0;
  while (out.length < limit && buckets.some(b => b.length)) {
    const b = buckets[i % buckets.length];
    if (b.length) { const id = b.shift(); if (!seen.has(id)) { seen.add(id); out.push(id); } }
    i++;
  }
  return out;
}

function stat(n, label){ return `<span><b>${n}</b> ${label}</span>`; }
const TABS = [["#/", "Today"], ["#/syllabus", "Syllabus"], ["#/review", "Review"], ["#/mock", "Mock paper"], ["#/drill", "Drill"], ["#/words", "Word bank"], ["#/daily", "Daily"], ["#/sources", "Sources"]];
function setTabs(active){
  const t = totals();
  $("#tabs").innerHTML = TABS.map(([h, l]) => `<a href="${h}" ${h === active ? 'aria-current="page"' : ""}>${l}${h === "#/review" && t.due ? ` (${t.due})` : ""}</a>`).join("");
}
function header(){
  const t = totals();
  $("#stats").innerHTML = stat(t.stock, "questions") + stat(core.lexiconSize, "words") + stat(t.due, "due now") + stat(pct(t.solid, t.stock) + "%", "solid");
}

// ---------------------------------------------------------------- one question at a time
function runner(box, items, label, done){
  let i = 0, right = 0;
  const step = () => {
    box.innerHTML = "";
    if (i >= items.length) {
      box.innerHTML = `<div class="card"><span class="big">${right} / ${items.length}</span><span class="muted">right in this set</span><div class="actions"><a class="btn primary" href="#/">Back to Today</a></div></div>`;
      if (done) done(right, items.length);
      header(); setTabs(location.hash || "#/");
      return;
    }
    const q = items[i];
    const head = document.createElement("p"); head.className = "qnum"; head.textContent = `${label} ${i + 1} of ${items.length}`;
    box.appendChild(head);
    const card = qcard(q, {onAnswer: (_q, ok) => {
      if (ok) right++;
      const nx = document.createElement("button"); nx.className = "btn primary"; nx.textContent = i + 1 < items.length ? "Next question" : "Finish";
      nx.addEventListener("click", () => { i++; step(); });
      const wrap = document.createElement("div"); wrap.className = "actions"; wrap.appendChild(nx);
      $(".reveal", card).appendChild(wrap); nx.focus();
    }});
    box.appendChild(card);
  };
  step();
}

// ---------------------------------------------------------------- views
async function vToday(v){
  setTabs("#/");
  const t = totals(), bp = core.blueprint, rows = formatRows();
  const risk = rows.reduce((s, f) => s + f.risk, 0);
  const lastMock = ST.mocks[ST.mocks.length - 1];
  let h = `<section class="block"><h2>Today</h2><div class="tiles">
    <div class="tile ${t.due ? "hot" : ""}"><span>due for review</span><b>${t.due}</b><small>${t.due ? "answer these before anything new" : "nothing waiting"}</small></div>
    <div class="tile ${t.mistakes ? "hot" : ""}"><span>mistake book</span><b>${t.mistakes}</b><small>wrong at least once, not yet solid</small></div>

async function vMock(v, go){
  setTabs("#/mock");
  const bp = core.blueprint;
  if (!bp) { v.innerHTML = `<p class="empty">No paper has been filed yet, so there is nothing to shape a mock from.</p>`; return; }
  if (!go) {
    v.innerHTML = `<div><h2>Timed paper</h2><p class="lead">${bp.perPaper} questions in ${bp.minutes} minutes, marked +${bp.marks.right} for a right answer and ${bp.marks.wrong} for a wrong one. Blanks cost nothing. The mix is the mix of the ${bp.papers} paper${bp.papers === 1 ? "" : "s"} we have filed.</p></div>
      <div class="wrap"><table class="t"><thead><tr><th>Question type</th><th class="n">In this paper</th></tr></thead><tbody>${Object.entries(bp.mock).map(([f, n]) => `<tr><td>${esc(core.formats[f] || f)}</td><td class="n">${n}</td></tr>`).join("")}</tbody></table></div>
      <div class="actions"><a class="btn primary" href="#/mock/go">Start the clock</a><a class="btn" href="#/">Not now</a></div>
      ${ST.mocks.length ? `<section class="block"><h3>Earlier papers</h3><div class="wrap"><table class="t"><thead><tr><th>When</th><th class="n">Score</th><th class="n">Right</th><th class="n">Wrong</th><th class="n">Blank</th><th class="n">Time</th></tr></thead><tbody>${ST.mocks.slice().reverse().map(m => `<tr><td>${new Date(m.ts).toLocaleString()}</td><td class="n">${m.score} / ${m.max}</td><td class="n">${m.right}</td><td class="n">${m.wrong}</td><td class="n">${m.skipped}</td><td class="n">${Math.floor(m.secs / 60)}m ${m.secs % 60}s</td></tr>`).join("")}</tbody></table></div></section>` : ""}`;
    return;
  }
  const by = await everyQuestion();
  const pool = {};
  Object.values(by).forEach(q => (pool[q.fmt] || (pool[q.fmt] = [])).push(q));
  const seenCount = q => { const x = ST.items[q.id]; return x ? x.n : 0; };
  const picked = [], tail = [];
  for (const [f, n] of Object.entries(bp.mock)) {
    let cands = (pool[f] || []).slice();
    if (f === "rc") {
      const byP = {};
      cands.forEach(q => { if (q.passage) (byP[q.passage] || (byP[q.passage] = [])).push(q); });
      const groups = Object.values(byP).filter(g => g.length >= n);
      if (groups.length) {
        groups.sort((a, b) => a.reduce((s, q) => s + seenCount(q), 0) - b.reduce((s, q) => s + seenCount(q), 0));
        tail.push(...groups[0].slice(0, n)); continue;
      }
    }
    cands.sort((a, b) => seenCount(a) - seenCount(b) || Math.random() - 0.5);
    picked.push(...cands.slice(0, n));
  }
  for (let i = picked.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [picked[i], picked[j]] = [picked[j], picked[i]]; }
  const paper = picked.concat(tail);
  v.innerHTML = `<div class="sticky"><span class="timer" id="clock">${bp.minutes}:00</span><span class="mono muted" id="prog">0 of ${paper.length} answered</span><span class="actions"><button class="btn primary" id="sub">Submit</button></span></div><div id="qs" class="block"></div>`;
  const box = $("#qs"), cards = [];
  paper.forEach((q, i) => {
    const head = document.createElement("p"); head.className = "qnum"; head.textContent = `Question ${i + 1}`;
    box.appendChild(head);
    const c = qcard(q, {exam: true, onPick: () => { $("#prog").textContent = `${cards.filter(x => x._pick).length} of ${paper.length} answered`; }});
    cards.push(c); box.appendChild(c);
  });
  let left = bp.minutes * 60, timer = null, submitted = false;
  const tick = () => {
    left--;
    const m = Math.floor(Math.max(left, 0) / 60), s = Math.max(left, 0) % 60;
    const c = $("#clock"); if (!c) { clearInterval(timer); return; }
    c.textContent = `${m}:${String(s).padStart(2, "0")}`;
    if (left <= 60) c.classList.add("low");
    if (left <= 0) submit(true);
  };
  const submit = auto => {
    if (submitted) return; submitted = true;
    clearInterval(timer);
    let right = 0, wrong = 0, skipped = 0;
    const byFmt = {};
    cards.forEach(c => {
      const q = c._q, pick = c._pick, o = byFmt[q.fmt] || (byFmt[q.fmt] = {n: 0, c: 0});
      o.n++;
      if (!pick) skipped++; else if (pick === q.key) { right++; o.c++; record(q.id, true); } else { wrong++; record(q.id, false); }
      c._grade();
    });
    const score = right * bp.marks.right + wrong * bp.marks.wrong, max = paper.length * bp.marks.right;
    const secs = bp.minutes * 60 - Math.max(left, 0);
    ST.mocks.push({ts: Date.now(), score: score, max: max, right: right, wrong: wrong, skipped: skipped, secs: secs, minutes: bp.minutes, byFmt: byFmt});
    save(); header();
    const rows = Object.entries(byFmt).sort((a, b) => (a[1].c / a[1].n) - (b[1].c / b[1].n))
      .map(([f, o]) => `<tr><td>${esc(core.formats[f] || f)}</td><td class="n">${o.c}/${o.n}</td></tr>`).join("");
    const card = document.createElement("section"); card.className = "block";
    card.innerHTML = `<div class="card"><span class="big">${score} / ${max}</span><span class="muted">${right} right · ${wrong} wrong (${(wrong * bp.marks.wrong).toFixed(1)} marks) · ${skipped} left blank${auto ? " · time ran out" : ""}</span><span class="mono">${Math.floor(secs / 60)}m ${secs % 60}s used of ${bp.minutes}m</span></div>
      <div class="wrap"><table class="t"><thead><tr><th>Question type</th><th class="n">Right</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="actions"><a class="btn primary" href="#/">Back to Today</a><a class="btn" href="#/review/mistakes">Work on what went wrong</a></div>
      <p class="muted">Every answer below is marked, with the rule behind it. Scroll through the ones you got wrong first.</p>`;
    $("#sub").replaceWith(card);
    $("#clock").textContent = "done"; $("#prog").textContent = `${right} right of ${paper.length}`;
    window.scrollTo(0, 0);
  };
  $("#sub").addEventListener("click", () => submit(false));
  timer = setInterval(tick, 1000);
  window.addEventListener("hashchange", () => clearInterval(timer), {once: true});
}

  if (!date) {
    v.innerHTML = `<div><h2>Daily</h2><p class="muted" style="margin:2px 0 0">One drop per editorial or article: the words and idioms, a short capsule, and a quiz built from it.</p></div>` +
      (core.days.length ? `<div class="grid">${core.days.slice().reverse().map(d => `<div class="card"><a class="title" href="#/daily/${d.date}">${esc(d.date)}</a><span class="muted">${esc(d.publication || "")}${d.title ? ": " + esc(d.title) : ""}</span><div class="chips"><span class="chip">${d.words} words</span><span class="chip">${d.capsule} points</span><span class="chip">${d.questions} questions</span>${d.passage ? '<span class="chip">passage</span>' : ""}</div></div>`).join("")}</div>` : `<p class="empty">No daily drops yet. Send an editorial or a newspaper page and the first one is built from it.</p>`);
    return;
  }
  const d = await J(`data/days/${date}.json`);
  const lex = new Map(d.words.map(w => [w.id, w]));
  let h = `<p class="pagenav"><a href="#/daily">← All days</a></p><div><h2>${esc(date)}</h2><p class="muted" style="margin:2px 0 0">${esc(d.paper.publication)}${d.paper.title ? ": " + esc(d.paper.title) : ""}</p></div>`;
  h += `<section class="block"><h3>Capsule</h3>${d.capsule.map(c => `<details><summary>${bold(c.text)}</summary>${(c.more || []).length ? `<ul>${c.more.map(m => `<li>${bold(m)}</li>`).join("")}</ul>` : ""}${(c.words || []).map(w => lex.get(w)).filter(Boolean).map(w => `<p><b>${esc(w.w)}</b>: ${esc(w.meaning)} <span class="muted">“${esc(w.ex)}”</span></p>`).join("")}</details>`).join("")}</section>`;
  if (d.passage) h += `<section class="block"><h3>${esc(d.passage.title)}</h3><p class="lead">${esc(d.passage.text)}</p><div id="pq" class="block"></div></section>`;
  h += `<section class="block"><h3>Quiz</h3><div id="dq" class="block"></div></section>`;
  v.innerHTML = h;
  const fin = q => Object.assign({}, q, {wrong: Object.fromEntries(Object.entries(q.wrong).map(([k, x]) => [k, typeof x === "string" ? {kind: "ruled-out", note: x} : x])), level: q.level || "Easy", tech: q.tech || []});
  (d.passage ? d.passage.questions : []).forEach(q => $("#pq").appendChild(qcard(fin(q))));
  d.quiz.forEach(q => $("#dq").appendChild(qcard(fin(q))));
}

async function vSources(v){
  setTabs("#/sources");
  const link = l => l ? `<a href="${esc(l)}" rel="noopener" target="_blank">open</a>` : `<span class="muted">no link</span>`;
  const bp = core.blueprint;
  v.innerHTML = `<h2>Sources</h2><section class="block"><h3>Papers</h3>${core.papers.length ? `<div class="grid">${core.papers.map(p => `<div class="card"><b>${esc(p.exam)} · ${esc(p.date)}${p.shift ? " · shift " + p.shift : ""}</b><span class="muted">${esc(p.kind)}${p.publisher ? " · " + esc(p.publisher) : ""}</span><span class="mono">${p.n} questions, ${p.built} playable${p.derivedKeys ? `, ${p.derivedKeys} keys not from an official SSC key` : ""}</span>${link(p.link)}</div>`).join("")}</div>` : `<p class="empty">No papers filed yet.</p>`}</section>
  <section class="block"><h3>Daily sources</h3>${core.days.length ? `<div class="grid">${core.days.map(d => `<div class="card"><b>${esc(d.date)}</b><span class="muted">${esc(d.publication || "")}${d.pages ? " · p. " + esc(d.pages) : ""}</span>${link(d.link)}</div>`).join("")}</div>` : `<p class="empty">No daily drops yet.</p>`}</section>
  <section class="block"><h3>Outside reading</h3>${core.refs.length ? `<ul>${core.refs.map(r => `<li><a href="${esc(r.url)}" rel="noopener" target="_blank">${esc(r.title)}</a> <span class="muted">${esc(r.note)}</span></li>`).join("")}</ul>` : `<p class="empty">None yet.</p>`}</section>
  <details><summary>How the paper is measured, and what the words on this site mean</summary>
    ${bp ? `<p><b>The blueprint.</b> ${esc(bp.note)} A paper is taken to be ${bp.perPaper} questions in ${bp.minutes} minutes at +${bp.marks.right} and ${bp.marks.wrong}.</p>
    <p><b>Marks at risk.</b> For each question type, its questions per paper multiplied by the share you are getting wrong, turned into marks. A type you have never tried counts as fully at risk.</p>
    <p><b>Solid.</b> A question becomes solid when you have answered it right ${SOLID} times running; it then comes back after a week, then a fortnight, then five weeks.</p>` : ""}
    <ul>${Object.values(core.rubric).map(x => `<li>${esc(x)}</li>`).join("")}</ul><p>${esc(core.likelihood)}</p></details>`;
}

// ---------------------------------------------------------------- router
async function route(){
  const v = $("#view"), h = location.hash || "#/";
  try {
    const [, a, b, c] = h.split("/");
    if (!a) await vToday(v);
    else if (a === "syllabus") await vSyllabus(v);
    else if (a === "topic") await vTopic(v, b, c);
    else if (a === "review") await vReview(v, b);
    else if (a === "mock") await vMock(v, b === "go");
    else if (a === "drill" || a === "practice") await vDrill(v, b);
    else if (a === "daily") await vDaily(v, b);
    else if (a === "words") await vWords(v);
    else if (a === "sources") await vSources(v);
    else await vToday(v);
    if (!c) window.scrollTo(0, 0);
  } catch (e) { v.innerHTML = `<p class="empty">Could not load this page (${esc(e.message)}).</p>`; }
}
(async function(){
  try {
    core = await J("data/core.json");
    ROWS = core.bank.rows.map(r => ({id: r[0], topic: r[1], qtype: r[2], fmt: r[3], level: r[4], src: r[5]}));
    header();
    $("#foot").textContent = "Your answers are saved in this browser only. Today → Your record has a copy you can keep.";
    window.addEventListener("hashchange", route); route();
  } catch (e) { $("#view").innerHTML = `<p class="empty">Could not load the data (${esc(e.message)}).</p>`; }
})();
})();
</script>
